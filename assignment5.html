    }

    }

    }

        background-color: #00D693;

        width: 50%;
        margin: 1em;
    }

</head>
<body>
    <div class="content">
        <h1>what is semantic HTML</h1>
        <div class="SEANDNONE"><p>Non sematic HTML</p>
            <p>Semantic HTML</p></div>
        <div class="container">
            <div class="left">
                <div class="header">&lt;div&gt;</div>
                <div class="span">&lt;span&gt;</div>

                        </div>
                        <div class="aside22">&lt;div&gt;</div>

            </div>
            <div class="right">
                
                <header>&lt;header&gt;</header>
                <nav>&lt;nav&gt;</nav>
                <div class="secaside">
                <aside>&lt;aside&gt;</aside>
                <main> &lt;main&gt;
                    <article>&lt;article&gt;
                     <figure>&lt;figure&gt;</figure>
                     <p>&lt;p&gt;</p>
                      </article>
                    
                </main>
               
                </div>

                <footer>&lt;footer&gt;</footer>
               
            </div>
        </div>
