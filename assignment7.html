<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         *{
         padding: 0;
         margin: 0;
         box-sizing: border-box;
         
        }
        main{
            background-color:black;
            max-width: 850px;
            height: 500px;
           justify-content: center;
           margin: 8em 18em;
        }
        header{
            display: flex; 
            gap: 220px;
            background-color: black;
            padding-top: 10px;
            padding-left: 25px;
            
        }
        #up{
            background-color: white;
            color: black;
            border-radius: 5px;
            padding: 5px;
        }
        #n01{
          display: flex;  
          list-style: none;
          gap: 20px;
          color: white;
        }
        #n02{
            display: flex;
            list-style: none;
            gap: 20px;
            color: white;
        }
        /* major */
        .major{
            display: flex;
            margin-top: 45px;
            gap: 150px;
        }
        /* left */
        .left{
            padding-left: 50px;
        }
        .inp{
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
            
            
        }
        h1{
            padding-top: 70px;
            color: white;
            
        }
        h4{
            padding-top: 30px;
            padding-bottom: 20px;
            color: white;
        }
        .my{
            padding: 12px ;
            border-radius: 10px;

        }
        /* button */
       #but{padding-top:10px ;
        padding-bottom: 10px;
        padding-left: 25px;
        padding-right: 25px;
        border-radius: 10px;
       }
       
    </style>
</head>
<body>
    <main>
        <header>
          <nav>
            <ul id="n01">
               <li><h3>uber</h3></li>
                <li>Ride</li>
                <li>Drive</li>
                <li>Business</li>
                <li>Uber Eats</li>
                <li>About</li>
          </ul>  
          </nav>
          <nav>
              <ul id="n02">
                <li>EN</li>
                <li>Help</li>
                <li>log in</li>
                <li id="up">sign up</li>
              </ul>
          </nav>
        </header>
        <div class="major">
            <div class="left">
                <h1>Go anywhere with uber</h1>
               <h4> Request a ride, hop in, and go</h4>
                <div class="inp">
                     <input class="my" type="text" name="" id="" placeholder="Enter location">
            
                <input  class="my" type="tex" name="" id="" placeholder="Enter destination">

                </div>
                <button id="but">See prices</button>
            </div>
             <div class="right">
                <img  src="../assets/WhatsApp Image uber.jpeg" alt="">
            </div>
        </div>
    </main>
</body>
</html>
