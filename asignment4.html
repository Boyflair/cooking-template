<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to your Account</title>
    <style>
     *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: rgb(93, 34, 148);
        }
        main{
            display: flex;
            width: 50em;
            height: 70dvh;
            margin:7em auto;
        }
        .left{
            background-color: #14122A;
            text-align: center;
            padding: 100px 30px 30px 30px;
        }
        .left h3{
            color: white;
        }
        .left p{
            padding: 40px 0;
            text-align: start;
            margin: 0 3em;
            color: white;
        }
         #btn1{
            background-color:#3A5999 ;

        }
         #btn2{
            background-color:#00ACEE ;

        }
        #btn3{
            background-color:#C42F11 ;

        }
       
        .social{
            text-align: center;
            margin-left: 3em;
        }
        .social button{
            display: block;
            text-align: center;
            padding: 10px ;
            width: 80%;
            margin-bottom: 1em;
            border-radius: 4px;
            border: none;
            color: white;
   
        }
        /* Right */
         .right{
            background-color: aliceblue;
            width: 100%;
            text-align: center;
            padding: 2em 1em 1em 1.5em;
        }
        .header{
            color: #14122A;
        }
        .header p{
            padding:.5em 0 2em 0;
        }
        .input input{
            display: block;
            padding: 13px;
            width: 95%;
            margin-bottom: 1.5em;
            border: none;
            box-shadow: 2px 3px 2px #14122a3f;
        }
        .remember_forgot{
            display: flex;
            justify-content: space-between;
            padding: 18px 18px 48px 18px;
        }
        #btn_login{
            background-color:#4E78FF ;
            border: none;
            width: 95%;
            padding: 15px;
            color: white;

        }
        span{
            color: #4E78FF;
        }  
    </style>
</head>
<body>
       <main>
        <div class="left">
            <h3>TOP HTML</h3>
            <P>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Obcaecati, porro.</P>
            <div class="social">
                <button id="btn1">Signin with facebook</button>
                <button id="btn2">Signin with twitter</button>
                <button id="btn3">Signin with google</button>
            </div>

        </div>
        <div class="right">
            <div class="header">
                <h1>Login to your account</h1>
                <p>Don't Have an account? <Span>Sign Up Free!</Span></p>
            </div>
            <form action="">
              <div class="input">
                  <input type="email" name="" id="" required placeholder="Email address">
                <input type="password" name="" id="" required placeholder="Password">
              </div>
                <div class="remember_forgot">
                    <div class="remember">
                    <input type="checkbox" name="" id="">
                    <label for="">Remember me</label>
                </div>
                <span>Forgot Password?</span>
                </div>
                <input id="btn_login" type="button" value="Login with email">
            </form>
        
        </div>
    </main>
    
</body>
</html>
